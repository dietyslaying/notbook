llm:
  model_name: "gemini-3.5-flash"
  temperature: 0.15
  top_p: 0.9
  top_k: 32
  max_output_tokens: 8192

cache:
  ttl: 3600
  max_entries: 500

# --- Embeddings (upgrade from e5-large) ---
# After changing provider/model/dimension you MUST re-ingest PDFs into the
# configured index (old 1024-d e5 vectors are incompatible with 768-d Gemini).
embeddings:
  provider: gemini                 # gemini | pinecone
  model: gemini-embedding-001      # or gemini-embedding-2 when stable for you
  dimension: 768                   # recommended: 768 | 1536 | 3072
  batch_size: 24

# Cross-encoder / Gemini listwise rerank after hybrid fusion
reranker:
  enabled: true
  backend: auto                    # auto | gemini | cross_encoder | none
  model: BAAI/bge-reranker-v2-m3   # used when backend=cross_encoder / auto+installed
  candidate_k: 12                  # pool size into the reranker
  top_k: 4                         # final chunks into the LLM

pinecone:
  # New index name avoids clashing with old 1024-d e5 index
  index_name: "library-index-v2"
  dimension: 768
  # Legacy field (used only when embeddings.provider=pinecone)
  embedding_model: "multilingual-e5-large"
  top_k_per_namespace: 5
  top_k_dense: 16
  top_k_final: 4
  hybrid_alpha: 0.65   # weight for dense vs BM25 before rerank
  # Book router: search only likely namespaces (fallback to all if unsure)
  router:
    max_namespaces: 3
    min_score: 0.12
    always_include_top: 1
    fallback_to_all: true
    use_probe: true
    probe_weight: 0.75

# Post-generation grounding against retrieved chunks
faithfulness:
  enabled: true
  min_claim_score: 0.28
  min_overall_score: 0.22
  max_retries: 1
  strict: true

bot:
  rate_limit_per_minute: 8
  max_message_chars: 3800
  # Telegram Bot API 10.1+ native rich messages (headings, lists, tables, details…)
  rich_messages: true
  # Live draft bubble while answering (private chats only; final message still required)
  stream_drafts: true
  # Library framing (always shown). Not a clinician — textbook compiler only.
  # Intentionally empty: the bot never identifies itself as a library, a
  # medical tool, or anything else. "Based on Provided Excerpts…" is the only
  # framing line users ever see (case answers).
  library_framing: ""
  disclaimer: ""
  emergency_banner: >
    If this is a real emergency (severe symptoms, danger to life, self-harm),
    contact local emergency services now.

adhd:
  max_summary_chars: 280
  max_facts: 3
  max_fact_chars: 90
  max_section_chars: 900
  max_sections: 5
  max_paragraph_chars: 160
  strip_emojis: true
  filler_phrases:
    - "it is important to note"
    - "it should be noted"
    - "in conclusion"
    - "as mentioned above"
    - "it is worth noting"
    - "needless to say"
    - "in other words"
    - "as we all know"
    - "the fact of the matter is"
    - "at the end of the day"

study_modes:
  brief:
    label: "30-second"
    max_facts: 2
    max_sections: 0
    max_summary_chars: 160
    focus: "Ultra short overview only. No deep sections. 2 facts max."
  standard:
    label: "Standard"
    max_facts: 3
    max_sections: 4
    max_summary_chars: 280
    focus: "Balanced study answer with short detail sections."
  exam:
    label: "Exam"
    max_facts: 3
    max_sections: 4
    max_summary_chars: 220
    focus: "High-yield exam points, traps, must-recall lists. Sections: Must-know, Traps."
  ward:
    label: "Practical"
    max_facts: 3
    max_sections: 3
    max_summary_chars: 200
    focus: "Practical: always answers with the full clinical case work-up format (16 sections, one long message), regardless of question wording."

# --- Clinical case work-up (Phase 8) ---
# A question that reads like a patient vignette (age/sex + complaint/duration)
# answers with the full case framework instead of the normal study answer.
# A "situation lens" (archetype) adapts emphasis to the presentation type;
# the 15-section skeleton and its order never change.
case_framework:
  enabled: true
  detection_threshold: 4   # score: age/sex=3, complaint wording=2, duration=1; age/sex+either always qualifies
  max_bullets: 8
  max_bullet_chars: 170
  show_lens: true          # "Situation · <archetype>" banner on case answers
  archetypes:
    acute:
      label: "Acute / red-flag"
      emoji: "🚨"
      focus: >
        This is an acute presentation. If unstable, prioritize ABCDE, vitals,
        immediate life threats and stabilization. If stable, make must-not-miss
        diagnoses explicit (ACS, PE, aortic dissection, sepsis), list red flags
        and escalation criteria, and state admission thresholds.
      suggest:
        - "What not to miss"
        - "First steps"
    obstetric:
      label: "Pregnancy / obstetric"
      emoji: "🤰"
      focus: >
        Include pregnancy status and gestation. Prioritize obstetric red flags
        (bleeding, pre-eclampsia, reduced fetal movements), fetal assessment,
        and urgent referral thresholds.
      suggest:
        - "Obstetric red flags"
        - "Fetal assessment"
    pediatric:
      label: "Pediatric"
      emoji: "🧒"
      focus: >
        Age-specific priorities: hydration and feeding, fever handling, growth,
        weight-based drug dosing, and red flags in children (meningism, sepsis,
        dehydration). State admission criteria and safeguarding.
      suggest:
        - "Red flags in children"
        - "Hydration & feeding"
    psychiatric:
      label: "Psychiatric"
      emoji: "🧠"
      focus: >
        Prioritize risk to self and others, safety plan, capacity, safeguarding,
        admission criteria and follow-up. Cover substance use when relevant.
      suggest:
        - "Risk assessment"
        - "Safety plan"
    geriatric:
      label: "Geriatric"
      emoji: "👴"
      focus: >
        Include baseline function, frailty, falls, polypharmacy and de-prescribing,
        delirium vs dementia, social support and capacity. Adjust management to
        function, not just age.
      suggest:
        - "Baseline function"
        - "Polypharmacy"
    chronic:
      label: "Chronic care"
      emoji: "🗓️"
      focus: >
        Long-standing problem: deepen history (adherence, lifestyle), monitoring
        plan, treatment ladder, and prevention / secondary prevention. Give a
        realistic follow-up timeline.
      suggest:
        - "Monitoring"
        - "Prevention"
    general:
      label: "General"
      emoji: "📘"
      focus: "Balanced work-up across all sections."
      suggest: []

# Telegram webhook mode. Keeps the bot awake on Render free tier: every
# incoming update is inbound HTTP traffic, so the instance never idles out.
# Enabled automatically when RENDER_EXTERNAL_URL (or webhook.public_url) is set.
webhook:
  enabled: true
  path: "/webhook"
  secret_token: "81049240ffd1c5265b6b759de2375069"
  public_url: ""   # optional override; auto-detected from RENDER_EXTERNAL_URL

srs:
  daily_new_limit: 20
  default_ease: 2.5

ingest:
  chunk_max_chars: 600
  chunk_overlap: 80
  batch_size: 64
