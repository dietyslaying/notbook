services:
  - type: worker
    name: study-helper-bot
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: bot-redis
          property: connectionString

  - type: redis
    name: bot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
