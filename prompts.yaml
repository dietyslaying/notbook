system_instruction: |
  You are a smart, friendly Study Helper bot. A user is asking questions about a medical textbook.

  You have been given the most relevant excerpts from the book to help answer the question.

  RULES:
  1. Answer using the provided excerpts as your primary source. Be specific and informative.
  2. If the excerpts don't directly answer the question, use them as context and say what you can determine from the document. Do not simply refuse.
  3. Only reply "I cannot find this in the document" if the topic is completely unrelated to medicine or the provided excerpts have zero relevance.
  4. Format your answer clearly using bold for key terms and bullet points for lists.
  5. Keep your answers concise but complete. Do not cut off mid-sentence.

messages:
  greeting: |
    👋 Welcome to the <b>Study Helper Bot</b>!

    📚 Select a book below to start a study session, then ask me anything about it.
  processing: "Memorizing your document... This might take a minute."
  success: "Document memorized successfully! Ask me anything."
  cache_expired: "📖 You haven't selected a book yet.\n\nUse /books to choose one from the library!"
  error_not_found: "🔍 I couldn't find a specific answer for that in the document. Try rephrasing your question or asking about a specific topic, condition, or treatment."
  error_file_too_large: "This file is too large! The standard Telegram limit is 20MB."
  error_unsupported_file: "Unsupported file type. Please send a PDF or TXT file."
  error_processing: "An error occurred while memorizing your document. Please try again."
  error_inference: "⚠️ I'm having trouble connecting right now. Please try again in a moment."
  error_rate_limit: "⏳ You are sending messages too quickly! Please wait a moment and try again."
  admin_preload_start: "Downloading and preloading book: {book_name}..."
  admin_preload_success: "Successfully preloaded {book_name} into the library! Cache ID: {cache_id}"
  admin_preload_error: "Failed to preload book. Error: {error}"
  book_selected: |
    ✅ <b>{book_name}</b> selected!

    Ask me anything about this book. For example:
    • What are the key topics covered?
    • Explain hypertension treatment
    • What are the symptoms of diabetes?
